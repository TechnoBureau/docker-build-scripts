default_user: "65532"
default_distros:
  - hummingbird
default_variants:
  - default
  - builder
default_rpm_packages:
  all:
    - crypto-policies-config-fips
    - openssl-config-fips
  builder:
    - bash
    - dnf5
    - shadow-utils
variant_descriptions:
  default: "Standard production image"
default_variant_repos:
  hummingbird:
    - hummingbird.repo
oscap:
  enabled: true
  profiles:
    cis: true
    stig:
      variants:
        - "*fips*"
  exclude_rules:
    - id: xccdf_org.ssgproject.content_rule_root_path_no_dot
      reason: "False positive: environmentvariable58 probe requires /proc which is unavailable in offline chroot scanning"
registry: ghcr.io/technobureau
labels:
  maintainer: "Technobureau"
  vendor: "Technobureau"
  source_url: "https://github.com/technobureau/containers"
